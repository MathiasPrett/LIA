[project]
name = "lia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MathiasPrett", email = "mprett@uc.cl" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.199.0",
    "google-auth>=2.57.0",
    "google-auth-oauthlib>=1.4.1",
    "google-genai>=2.20.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot[job-queue]>=21",
    "sqlalchemy>=2",
]

[project.scripts]
lia = "lia.__main__:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
